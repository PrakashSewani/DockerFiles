version: '3.8'

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: paperclip
    ports:
      - "3100:3100"
    environment:
      - HOST=0.0.0.0
      - PAPERCLIP_PORT=3100
      - PAPERCLIP_HOME=/paperclip
      - PAPERCLIP_PUBLIC_URL=http://localhost:3100
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated # options: authenticated / local_trusted
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=private       # options: private / public
      - OPENAI_API_KEY=your_openai_key_here
      - ANTHROPIC_API_KEY=your_anthropic_key_here
      - BETTER_AUTH_SECRET=your_generated_random_secret_here
    volumes:
      - paperclip_data:/paperclip
    pids_limit: 2048
    restart: unless-stopped

volumes:
  paperclip_data:
